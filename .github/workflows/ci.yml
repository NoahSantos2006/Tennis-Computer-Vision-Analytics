name: Noah Santos

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # opencv-python needs these system libraries on a bare Ubuntu runner
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tennis-cv-analytics-backend .     # Dockerfile -> image named tennis-cv-analytics-backend 

      # The app reads its settings at import time, so give it dummy values and
      # check the container actually starts and answers /health.
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \                         
            -e ROBOFLOW_API_KEY=dummy -e WORKSPACE_NAME=x -e WORKFLOW_ID=x \
            -e WORKFLOW_ID_WITH_COURT_POINTS=x -e MAX_WORKERS=2 -e MAX_ATTEMPTS=2 \
            -e XGB_BOUNCE_THRESHOLD=0.7 -e XGB_HIT_THRESHOLD=0.5 \
            -e TENNIS_COURT_LENGTH=23.77 -e TENNIS_COURT_WIDTH=10.97 \
            -e TENNIS_COURT_SCALE=20 -e TENNIS_COURT_PADDING=50 \
            -e MAX_AGE=3600 -e CHECK_EVERY=3600 \
            tennis-cv-analytics-backend
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1