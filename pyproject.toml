[tool.pytest.ini_options]
# Run from the repo root so `import backend.main` works, same as uvicorn.
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["frontend", "storage", "testing.py"]

[tool.ruff.lint]
# Start with the rules that catch real bugs (syntax errors, undefined names).
# Widen this to ruff's defaults once the existing code is cleaned up.
select = ["E9", "F63", "F7", "F82"]